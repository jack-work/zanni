<!-- zanni · fontpack — the three faces, fetched together.
     Injected into </head> by zanni-inline (any *.head.html in a component
     goes there), because a stylesheet link belongs in the head and the
     preconnects are worthless if they arrive after the request they were
     meant to warm up.

     One request for three families, `display=swap` so type is readable
     before the webfont lands. If you would rather not talk to Google at
     all, drop this file and self-host the same three families: nothing
     else in fontpack refers to the CDN. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=VT323&display=swap">
