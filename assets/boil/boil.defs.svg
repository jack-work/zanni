<!-- zanni · boil — filter defs.
     Inlined into the host document by `zanni-inline`. It MUST be inline:
     CSS `filter: url(#id)` resolves only within the same document, and
     external `url(sprite.svg#id)` is Firefox-only in practice.

     The host <svg> is width/height 0 and position:absolute so it takes no
     layout, and aria-hidden so it is not announced.

     Note what is deliberately ABSENT: `color-interpolation-filters` is never
     set, so the whole chain runs in the SVG default linearRGB. Pinning sRGB
     changes how the blur and the alpha ramp compose, and the type stops
     matching figar.org. If you retune, retune on purpose. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- TYPE. Displace 1.2 → blur 0.4 → an alpha table that re-crisps the
       antialiasing while letting hairline rules pass through. The region is
       taller than it is wide (-14%/128% vs -6%/112%) because displaced
       descenders leave the box vertically first. -->
  <filter id="pixel-text" x="-6%" y="-14%" width="112%" height="128%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n">
      <animate attributeName="seed" values="3;7;13;5;11;3" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="1.2" result="d"/>
    <feGaussianBlur in="d" stdDeviation="0.4" result="b"/>
    <feComponentTransfer in="b"><feFuncA type="table" tableValues="0 0.2 1 1 1"/></feComponentTransfer>
  </filter>
  <!-- DIAGRAM SVG. Displacement only (1.4). Never add a threshold here: an
       alpha table destroys low-alpha fills and dimmed layers. -->
  <filter id="pixel-stage" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7" result="n">
      <animate attributeName="seed" values="7;3;12;5;9;7" dur="1.6s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="1.4"/>
  </filter>
  <!-- CHROME. Displacement only, calmest of the three (0.9). -->
  <filter id="pixel-ui" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="11" result="n">
      <animate attributeName="seed" values="11;4;9;14;6;11" dur="1.4s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="0.9"/>
  </filter>
</svg>
