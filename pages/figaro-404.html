:root {
--paper: #e7d4c4;
--paper-2: #dcc4b0;
--dither: #dfc9b6;
--gesso-cell: 6px;
--ink: #2b1a15;
--muted: #7a584a;
--rule: rgba(43, 26, 21, 0.2);
--gold: #a2762a;
--gold-bright: #d9a94e;
--oxblood: #7d2e2e;
--stage: #1a0d0f;
--stage-2: #271215;
--stage-ink: #f0dfc8;
--stage-muted: #a5887b;
--z-ground: light-dark(var(--paper), var(--stage));
--z-ground-2: light-dark(var(--paper-2), var(--stage-2));
--z-grain: light-dark(var(--dither), var(--stage-2));
--z-ink: light-dark(var(--ink), var(--stage-ink));
--z-muted: light-dark(#6b4a3d, var(--stage-muted));
--z-rule: light-dark(var(--rule), rgba(240, 223, 200, 0.18));
--z-line: light-dark(#c2a690, #4a2b2c);
--z-accent: light-dark(var(--oxblood), var(--gold-bright));
--z-on-accent: light-dark(#f6ede2, var(--stage));
--z-focus: light-dark(var(--gold), var(--gold-bright));
--z-ok: light-dark(#3d6b2a, #9cc47a);
--z-fail: light-dark(#a8322a, #ec7a64);
--z-warn: light-dark(#87580f, #e2b25c);
--z-tint: light-dark(rgba(125, 46, 46, 0.12), rgba(217, 169, 78, 0.16));
--z-shadow: light-dark(rgba(43, 26, 21, 0.3), rgba(0, 0, 0, 0.65));
}
:root[data-scheme=light] { color-scheme: light; }
:root[data-scheme=dark] { color-scheme: dark; }
.gesso {
background-color: var(--z-ground);
background-image: repeating-conic-gradient(var(--z-grain) 0% 25%, transparent 0% 50%);
background-size: var(--gesso-cell) var(--gesso-cell);
color: var(--z-ink);
}
.gesso-stage {
background-color: var(--stage);
background-image: repeating-conic-gradient(var(--stage-2) 0% 25%, transparent 0% 50%);
background-size: var(--gesso-cell) var(--gesso-cell);
color: var(--stage-ink);
}
.gesso ::selection { background: rgba(162, 118, 42, 0.25); }
.parla {
--parla-head: 104px;
--parla-mouth: 0.6;
--parla-tilt: -1.5deg;
--parla-outline: 3px;
--parla-teeter: 1.4deg;
--parla-bob: 2px;
display: flex;
align-items: flex-start;
gap: 1.3rem;
margin: 0.4rem 0 1.4rem;
}
.parla-head {
flex: none;
width: var(--parla-head);
height: var(--parla-head);
box-sizing: border-box;
image-rendering: pixelated;
border: 3px solid light-dark(#a2762a, #d9a94e);
background: #e7d4c4;
box-shadow: 4px 4px 0 var(--z-shadow);
}
.parla-bubble {
position: relative;
flex: 1;
min-height: 2.9em;
margin: 0.15rem 0 0;
padding: 0.75rem 1.05rem;
font: 19px/1.45 var(--fontpack-prose, Georgia, serif);
color: var(--z-ink);
background: var(--z-ground-2);
border: var(--parla-outline) solid var(--z-ink);
border-radius: 18px 18px 18px 10px;
box-shadow: 5px 5px 0 var(--z-shadow);
transform: rotate(var(--parla-tilt));
transform-origin: 0 60%;
animation:
parla-pop 320ms cubic-bezier(0.2, 1.6, 0.3, 1) both,
parla-teeter 5.2s ease-in-out infinite alternate,
parla-bob 3.3s ease-in-out infinite alternate;
}
.parla-bubble::before,
.parla-bubble::after {
content: "";
position: absolute;
border-style: solid;
border-color: transparent;
}
.parla-bubble::before {
left: calc(-20px - var(--parla-outline));
top: calc(var(--parla-head) * var(--parla-mouth) - 0.15rem - 12px);
border-width: 12px 22px 6px 0;
border-right-color: var(--z-ink);
}
.parla-bubble::after {
left: -15px;
top: calc(var(--parla-head) * var(--parla-mouth) - 0.15rem - 12px + var(--parla-outline) + 1px);
border-width: 8px 16px 3px 0;
border-right-color: var(--z-ground-2);
}
.parla-bubble.parla-wiggle {
animation:
parla-wiggle 420ms ease-in-out,
parla-teeter 5.2s ease-in-out infinite alternate,
parla-bob 3.3s ease-in-out infinite alternate;
}
.parla-bubble.parla-again { animation-name: parla-pop-again, parla-teeter, parla-bob; }
.parla-bubble.parla-ahem { font-family: var(--fontpack-mono, monospace); font-size: 24px; letter-spacing: 0.06em; }
@keyframes parla-pop {
from { opacity: 0; transform: rotate(var(--parla-tilt)) scale(0.6); }
to { opacity: 1; transform: rotate(var(--parla-tilt)) scale(1); }
}
@keyframes parla-pop-again {
from { opacity: 0.4; transform: rotate(var(--parla-tilt)) scale(0.92); }
to { opacity: 1; transform: rotate(var(--parla-tilt)) scale(1); }
}
@keyframes parla-teeter {
from { rotate: calc(-1 * var(--parla-teeter)); }
to { rotate: var(--parla-teeter); }
}
@keyframes parla-bob {
from { translate: 0 calc(0.5 * var(--parla-bob)); }
to { translate: 0 calc(-1 * var(--parla-bob)); }
}
@keyframes parla-wiggle {
0%, 100% { transform: rotate(var(--parla-tilt)); }
20% { transform: rotate(calc(var(--parla-tilt) - 3deg)) translateX(-3px); }
45% { transform: rotate(calc(var(--parla-tilt) + 3deg)) translateX(3px); }
70% { transform: rotate(calc(var(--parla-tilt) - 2deg)) translateX(-2px); }
}
@media (min-width: 640px) {
.parla { --parla-head: 130px; }
}
@media (prefers-reduced-motion: reduce) {
.parla-bubble,
.parla-bubble.parla-wiggle,
.parla-bubble.parla-again { animation: none; }
}
button.parla-bubble {
display: block;
width: auto;
text-align: left;
cursor: pointer;
touch-action: manipulation;
}
button.parla-bubble:focus-visible { outline: 3px solid var(--z-focus); outline-offset: 4px; }
:root { color-scheme: light dark; --fontpack-prose: 'z404-prose', Georgia, serif; }
html, body { margin: 0; min-height: 100vh; }
main { box-sizing: border-box; width: min(40rem, 100%); margin: 0 auto; padding: 12vh 1.25rem 3rem; }
h1 { margin: 0 0 1.6rem; font: 400 3rem/1 'z404-display', serif; letter-spacing: 0.03em; text-align: center; }
.back { display: block; margin: 1.4rem auto 0; padding: 0.5rem 1.2rem; font: 21px/1.2 'z404-mono', monospace; letter-spacing: 0.05em; color: var(--z-on-accent); background: var(--z-accent); border: 3px solid var(--z-ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--z-shadow); cursor: pointer; }
.back:focus-visible { outline: 3px solid var(--z-focus); outline-offset: 3px; }
</style>
