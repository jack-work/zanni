<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zanni · filo</title>
<link rel="stylesheet" href="../assets/fontpack/fonts.css">
<link rel="stylesheet" href="../assets/gesso/gesso.css">
<link rel="stylesheet" href="../assets/fontpack/fontpack.css">
<link rel="stylesheet" href="../assets/filo/filo.css">
<style>
  :root { color-scheme: light dark; }
  body { max-width: 40rem; margin: 3rem auto; padding: 0 1.2rem; font-size: 18px; }
  .panel { border: 3px solid var(--z-line); padding: 64px 16px 16px; }
  input { font: inherit; margin-top: 2rem; }
</style>
<body class="gesso">
<audio id="media" preload="auto"></audio>
<div class="panel"><div id="bar"></div></div>
<label>A text field, where keys are text: <input id="field"></label>
<script src="../assets/filo/filo.js"></script>
<script>
  function silence(seconds) {
    var rate = 8000, n = rate * seconds, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    function s(o, str) { for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
    s(0, 'RIFF'); v.setUint32(4, 36 + n, true); s(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    s(36, 'data'); v.setUint32(40, n, true);
    new Uint8Array(buf, 44).fill(128);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  var params = new URLSearchParams(location.search);
  var media = document.getElementById('media');
  media.src = silence(600);
  window.player = zanni.filo.attach(document.getElementById('bar'), media, {
    globalKeys: params.get('keys') !== 'focus',
    autohide: Number(params.get('autohide') || 0),
    title: 'Ten minutes of silence',
    chapters: [
      { start: 0, title: 'Overture' },
      { start: 120, title: 'Largo al factotum' },
      { start: 300, title: 'Una voce poco fa' },
      { start: 480, title: 'Finale' }
    ]
  });
  window.seeks = [];
  document.addEventListener('filo:seek', function (e) { seeks.push(e.detail); });
</script>
</body>
</html>
