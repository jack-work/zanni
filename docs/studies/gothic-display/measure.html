<!doctype html>
<meta charset="utf-8">
<style id="ff"></style>
<script>
const TITLES = ["Scope","List-price equivalent","Time to first token, by layer","Errors and retries","Turns","Events","Prompt cache","Inter-token latency"];
const PAIRS = [["c","e"],["e","o"],["a","o"],["n","u"],["n","r"],["u","r"],["f","s"],["t","l"],["i","l"],["I","L"],["S","E"],["T","I"]];

function glyph(ch, family, size) {
  const W = Math.ceil(size * 2.2), H = Math.ceil(size * 2.6), ox = Math.ceil(size * 0.6), by = Math.ceil(size * 1.7);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.font = `${size}px "${family}"`; x.textBaseline = "alphabetic"; x.fillStyle = "#000";
  x.fillText(ch, ox, by);
  const d = x.getImageData(0, 0, W, H).data, a = new Float32Array(W * H);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3] / 255;
  return { a, W, H, by, ox };
}

function rows(g, thr) {
  let top = null, bot = null;
  for (let y = 0; y < g.H; y++) { let m = 0; for (let x = 0; x < g.W; x++) m = Math.max(m, g.a[y * g.W + x]); if (m >= thr) { if (top === null) top = y; bot = y; } }
  return top === null ? null : { top, bot };
}

function heightAbove(ch, family, size, thr = 0.5) {
  const g = glyph(ch, family, size), r = rows(g, thr);
  return r ? g.by - r.top : 0;
}
function depthBelow(ch, family, size, thr = 0.5) {
  const g = glyph(ch, family, size), r = rows(g, thr);
  return r ? Math.max(0, r.bot + 1 - g.by) : 0;
}

function counters(ch, family, size) {
  const g = glyph(ch, family, size), { W, H } = g, ink = new Uint8Array(W * H);
  for (let i = 0; i < ink.length; i++) ink[i] = g.a[i] >= 0.5 ? 1 : 0;
  const seen = new Uint8Array(W * H), q = [];
  const push = (x, y) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const i = y * W + x; if (ink[i] || seen[i]) return; seen[i] = 1; q.push(i); };
  for (let x = 0; x < W; x++) { push(x, 0); push(x, H - 1); }
  for (let y = 0; y < H; y++) { push(0, y); push(W - 1, y); }
  while (q.length) { const i = q.pop(), x = i % W, y = (i / W) | 0; push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1); }
  const comps = [], lab = new Int32Array(W * H);
  let n = 0;
  for (let i = 0; i < W * H; i++) {
    if (ink[i] || seen[i] || lab[i]) continue;
    n++; const st = [i]; lab[i] = n; let area = 0, x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
    while (st.length) {
      const j = st.pop(), x = j % W, y = (j / W) | 0; area++;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const k = ny * W + nx; if (!ink[k] && !seen[k] && !lab[k]) { lab[k] = n; st.push(k); } }
    }
    comps.push({ area, w: x1 - x0 + 1, h: y1 - y0 + 1 });
  }
  comps.sort((p, q) => q.area - p.area);
  return comps;
}

function stemWidth(family, size) {
  const g = glyph("l", family, size), { W } = g, xh = heightAbove("x", family, size);
  const runs = [];
  for (let y = g.by - Math.max(2, xh) + 1; y < g.by; y++) {
    let best = 0, cur = 0;
    for (let x = 0; x < W; x++) { if (g.a[y * W + x] >= 0.5) { cur++; best = Math.max(best, cur); } else cur = 0; }
    if (best) runs.push(best);
  }
  runs.sort((a, b) => a - b);
  return runs.length ? runs[Math.floor(runs.length / 2)] : 0;
}

function crop(g) {
  let x0 = g.W, x1 = -1;
  for (let x = 0; x < g.W; x++) for (let y = 0; y < g.H; y++) if (g.a[y * g.W + x] > 0.02) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); }
  return { x0, x1 };
}

function pairDistance(c1, c2, family, size) {
  const A = glyph(c1, family, size), B = glyph(c2, family, size);
  const ca = crop(A), cb = crop(B);
  if (ca.x1 < 0 || cb.x1 < 0) return null;
  const sumA = A.a.reduce((s, v) => s + v, 0), sumB = B.a.reduce((s, v) => s + v, 0);
  let best = Infinity;
  for (let s = -2; s <= 2; s++) {
    let diff = 0;
    for (let y = 0; y < A.H; y++) for (let x = ca.x0 - 2; x <= ca.x1 + 2; x++) {
      const bx = x + (cb.x0 - ca.x0) + s;
      const av = x >= 0 && x < A.W ? A.a[y * A.W + x] : 0;
      const bv = bx >= 0 && bx < B.W ? B.a[y * B.W + bx] : 0;
      diff += Math.abs(av - bv);
    }
    for (let y = 0; y < A.H; y++) for (let bx = 0; bx < B.W; bx++) {
      const x = bx - (cb.x0 - ca.x0) - s;
      if (x >= ca.x0 - 2 && x <= ca.x1 + 2) continue;
      diff += B.a[y * B.W + bx];
    }
    best = Math.min(best, diff);
  }
  return best / Math.max(sumA, sumB, 1e-6);
}

function lineStats(family, size) {
  const font = `${size}px "${family}"`;
  const out = { widths: {}, soft: 0, ink: 0, band: 0 };
  let softPx = 0, anyPx = 0, inkSum = 0, bandArea = 0;
  const xh = heightAbove("x", family, size);
  for (const t of TITLES) {
    const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently: true });
    x.font = font;
    const w = x.measureText(t).width;
    out.widths[t] = w;
    c.width = Math.ceil(w) + Math.ceil(size); c.height = Math.ceil(size * 2.6);
    x.font = font; x.textBaseline = "alphabetic"; x.fillStyle = "#000";
    const by = Math.ceil(size * 1.7);
    x.fillText(t, Math.ceil(size * 0.5), by);
    const d = x.getImageData(0, 0, c.width, c.height).data;
    for (let i = 0; i < d.length; i += 4) {
      const al = d[i + 3] / 255;
      if (al > 0.02) { anyPx++; if (al > 0.12 && al < 0.88) softPx++; }
    }
    const y0 = Math.max(0, by - xh), y1 = by;
    for (let yy = y0; yy < y1; yy++) for (let xx = Math.ceil(size * 0.5); xx < Math.ceil(size * 0.5) + Math.ceil(w); xx++) { inkSum += d[(yy * c.width + xx) * 4 + 3] / 255; bandArea++; }
  }
  return { widths: out.widths, soft: anyPx ? softPx / anyPx : 0, density: bandArea ? inkSum / bandArea : 0 };
}

async function run(faces, sizes) {
  const css = faces.map((f) => `@font-face{font-family:"${f.family}";src:url("${f.file}") format("woff2");font-display:block}`).join("\n");
  document.getElementById("ff").textContent = css;
  await Promise.all(faces.map((f) => document.fonts.load(`20px "${f.family}"`, "Scope abc")));
  await document.fonts.ready;
  const res = [];
  for (const f of faces) {
    const list = sizes.concat(f.native ? [f.native, f.native * 2] : []).filter((v, i, a) => a.indexOf(v) === i && v <= 60).sort((a, b) => a - b);
    for (const s of list) {
      const xh = heightAbove("x", f.family, s), cap = heightAbove("H", f.family, s), asc = heightAbove("l", f.family, s), desc = depthBelow("p", f.family, s);
      const cs = {};
      for (const ch of ["e", "a", "o"]) cs[ch] = counters(ch, f.family, s).slice(0, 2);
      const pairs = {};
      for (const [p, q] of PAIRS) pairs[p + q] = pairDistance(p, q, f.family, s);
      const ls = lineStats(f.family, s);
      res.push({ id: f.id, size: s, xh, cap, asc, desc, stem: stemWidth(f.family, s), counters: cs, pairs, soft: ls.soft, density: ls.density, widths: ls.widths });
    }
  }
  return res;
}
</script>
